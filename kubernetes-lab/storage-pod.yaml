apiVersion: v1
kind: Pod
metadata:
  name: storage-demo
spec:
  containers:
    - name: storage-demo
      image: alpine:latest
      command: ["sh", "-c", "while true; do sleep 3600; done"]

      volumeMounts:
        - name: persistent-data
          mountPath: /data

  volumes:
    - name: persistent-data
      persistentVolumeClaim:
        claimName: devops-pvc
