services:
  web:
    image: nginx:latest
    ports:
      - "8081:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro

  client:
    image: alpine:latest
    command: sh -c "while true; do sleep 3600; done"
    environment:
      APP_ENV: production
      API_URL: http://web

  data:
    image: alpine:latest
    command: sh -c "while true; do sleep 3600; done"
    volumes:
      - app-data:/data

volumes:
  app-data: