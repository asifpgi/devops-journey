
name: Portfolio App CI

on:
  push:
    paths:
      - 'docker-lab/compose-lab/portfolio-app/**'
      - '.github/workflows/ci.yml'

  pull_request:
    paths:
      - 'docker-lab/compose-lab/portfolio-app/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docker-lab/compose-lab/portfolio-app/backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build Docker image
        run: docker build -t portfolio-backend:ci .



  publish:
    name: Publish backend image
    needs: test-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./docker-lab/compose-lab/portfolio-app/backend
          push: true
          tags: |
            ghcr.io/asifpgi/portfolio-backend:latest
            ghcr.io/asifpgi/portfolio-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
