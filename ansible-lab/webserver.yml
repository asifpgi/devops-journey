---
- name: Configure web server
  hosts: local
  become: true
  gather_facts: true

  vars:
    web_package: nginx
    web_service: nginx
    web_root: /var/www/html
    page_title: DevOps Journey
    page_heading: Welcome to Asif's Ansible Lab

  tasks:
    - name: Ensure Nginx is installed
      ansible.builtin.apt:
        name: "{{ web_package }}"
        state: present
        update_cache: true

    - name: Ensure Nginx is running
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: started
        enabled: true

    - name: Deploy web page
      ansible.builtin.template:
        src: templates/index.html.j2
        dest: "{{ web_root }}/index.html"
        mode: '0644'
      notify: Restart Nginx

  handlers:
    - name: Restart Nginx
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: restarted
